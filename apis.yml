aid: unweave
name: Unweave
description: >-
  Unweave is a London-based developer platform that describes itself as
  "Supabase for Machine Learning" — open source machine learning development
  environments with serverless GPU sessions, persistent volumes, SSH/VS Code
  access, project linking, and bring-your-own-cloud provider support (e.g.
  LambdaLabs), driven by a first-party CLI. Backed by Speedinvest. The platform
  is open source (Go) on GitHub, but development has been dormant since
  mid-2023: the docs and API hosts are offline while the marketing site, blog,
  changelog, and pricing pages remain up.
